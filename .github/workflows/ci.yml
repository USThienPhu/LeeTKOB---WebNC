name: CI Quality Gate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Quality Gate (Format, Lint, Typecheck, Test)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies strictly
        run: npm ci

      - name: 1. Format check (Prettier)
        run: npm run format:check

      - name: 2. Lint check (ESLint)
        run: npm run lint

      - name: 3. Type check (TypeScript)
        run: npm run typecheck

      - name: 4. Automated tests (Vitest)
        run: npm run test