services:
  leetkob-api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      SANDBOX_DOCKER_IMAGE: leetkob-sandbox:latest
      DOCKER_HOST: unix:///var/run/docker.sock
    ports:
      - "3000:3000"
    # Set DOCKER_GID in .env to the host socket's group ID on Linux.
    group_add:
      - "${DOCKER_GID:-0}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      leetkob-sandbox:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  # Build the image once; the API runner creates a fresh container for each job.
  leetkob-sandbox:
    image: leetkob-sandbox:latest
    build:
      context: .
      dockerfile: docker/Dockerfile.sandbox
    command: ["/bin/true"]
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 256m
    cpus: 1
